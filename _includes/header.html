<header
  class="site-header"
  role="banner"
  style="
    border-top: 5px solid #2a7ae2;
    border-bottom: 1px solid #e8e8e8;
    padding: 20px 0;
  "
>
  <div
    class="wrapper"
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: -webkit-calc(800px - (30px * 2));
      max-width: calc(800px - (30px * 2));
      margin-right: auto;
      margin-left: auto;
      padding-right: 30px;
      padding-left: 30px;
    "
  >
    <!-- Left Side: Site Branding/Title -->
    <a
      class="site-title"
      rel="author"
      href="{{ '/' | relative_url }}"
      style="
        font-size: 1.625rem;
        font-weight: 300;
        letter-spacing: -1px;
        text-decoration: none;
        color: #424242;
      "
    >
      {{ site.title | escape }}
    </a>

    <!-- Right Side: Your Automated Nav Items -->
    <nav class="site-nav">{% include nav.html %}</nav>
  </div>
</header>
