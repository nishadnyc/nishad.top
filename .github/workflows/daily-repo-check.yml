name: Daily Repo Analysis & Post Generation

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  GIT_USER_NAME: "${{ github.actor }}"
  GIT_USER_EMAIL: "${{ github.actor_id }}+${{ github.actor }}@://github.com"

jobs:
  analyze-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate posts from repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: node scripts/generate-posts.js

      - name: "[Debug] Grabbed user info"
        run: "echo Name: ${{ env.GIT_USER_NAME }}\nEmail: ${{ env.GIT_USER_NAME }}"
        shell: bash

      - name: Commit and push changes
        run: |
          git config --local user.email "${{ env.GIT_USER_EMAIL }}"
          git config --local user.name "${{ github.actor }}"
          git add _posts/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update repo analysis posts"
            git push
          fi
